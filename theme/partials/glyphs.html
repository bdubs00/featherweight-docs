{#- The glyphs of the app bar and the small controls: the 24-unit set of
    bossmode (src/ui/icons.tsx), with a stroke of 1.8 in currentColor. A
    glyph is decoration beside a word, so a screen reader skips it. -#}
{%- macro glyph(name, size=22) -%}
<svg class="glyph" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'start' -%}<path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/>
{%- elif name == 'guide' -%}<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 4v-4h0A1.5 1.5 0 0 1 4 14.5z"/>
{%- elif name == 'concepts' -%}<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5"/>
{%- elif name == 'deploy' -%}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{%- elif name == 'operate' -%}<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>
{%- elif name == 'reference' -%}<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>
{%- elif name == 'design' -%}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>
{%- elif name == 'theme' -%}<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
{%- elif name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
{%- elif name == 'back' -%}<path d="M15 5l-7 7 7 7"/>
{%- else -%}<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>
{%- endif -%}
</svg>
{%- endmacro -%}
