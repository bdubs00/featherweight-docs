site_name: Featherweight
site_description: Agents that run in sandboxes on Google AX, write every step to a ledger, sleep while they wait for you, and wake where they stopped.
site_url: https://bdubs00.github.io/featherweight-docs/
repo_url: https://github.com/bdubs00/featherweight-kernel
repo_name: bdubs00/featherweight-kernel
edit_uri: ""
docs_dir: docs
strict: false
exclude_docs: |
  assets/demos/README.md

# The theme of the site is its own, after the design language of bossmode.
# DESIGN.md is the plan of the look, and theme/ holds the templates.
theme:
  name: null
  custom_dir: theme
  search_index_only: true
  static_templates:
    - 404.html

hooks:
  - hooks/site.py

extra:
  # The glyph of each place of the app bar, by the title of its section.
  places:
    Start: start
    Guide: guide
    Concepts: concepts
    Deploy: deploy
    Operate: operate
    Reference: reference
    Design: design

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Start:
      - Featherweight: index.md
      - Run the kernel on your machine: getting-started/kernel-local.md
      - Run the workbench on your machine: getting-started/workbench-local.md
      - Use a fleet from Claude Code: getting-started/from-claude-code.md
  - Guide:
      - Bossmode at a glance: guide/index.md
      - Chat with an agent: guide/chat.md
      - Decisions and activity: guide/decisions.md
      - Bridges and seats: guide/bridges.md
      - The manager: guide/manager.md
      - Duties: guide/duties.md
      - Skills, tools, and packages: guide/skills.md
      - The wiki: guide/wiki.md
      - Routines: guide/routines.md
  - Concepts:
      - The four layers: concepts/layers.md
      - The run lifecycle: concepts/run-lifecycle.md
      - The ledger: concepts/ledger.md
      - Safeguards: concepts/safeguards.md
      - Profiles, tools, and skills: concepts/profiles-and-tools.md
      - Context, memory, and time: concepts/context-memory-time.md
      - Identity: concepts/identity.md
      - The fleet: concepts/fleet.md
      - Environments and agent programs: concepts/environments.md
      - Outcomes and check runs: concepts/outcomes.md
  - Deploy:
      - Build and images: deployment/images.md
      - One Task on AX: deployment/one-task-on-ax.md
      - A fleet: deployment/fleet.md
      - Pools and templates: deployment/pools.md
      - Serve bossmode: deployment/bossmode.md
      - Observability: deployment/observability.md
  - Operate:
      - Debugging a Task: operations/debugging.md
      - Platform gaps and patches: operations/platform-gaps.md
  - Reference:
      - fw commands: reference/fw-commands.md
      - fw-workbench commands: reference/fw-workbench-commands.md
      - Configuration: reference/configuration.md
      - Workbench configuration: reference/workbench-configuration.md
      - HTTP API: reference/http-api.md
      - Workbench routes: reference/workbench-routes.md
      - MCP tools: reference/mcp-tools.md
      - Glossary: glossary.md
  - Design:
      - About these documents: design/index.md
      - Kernel architecture: design/kernel-architecture.md
      - Kernel map: design/kernel-map.md
      - Kernel roadmap: design/kernel-roadmap.md
      - Workbench architecture: design/workbench-architecture.md
      - Product direction: design/product-direction.md
